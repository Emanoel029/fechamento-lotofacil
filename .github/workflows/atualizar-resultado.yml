name: Atualizar resultado mais recente da Lotofácil

on:
  schedule:
    # A cada 20 minutos. O GitHub não garante o minuto exato, mas roda com essa frequência.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Buscar o resultado mais recente (Caixa e espelho guidi.dev.br, usa o mais novo)
        run: |
          mkdir -p espelho
          python3 espelho/atualizar.py

      - name: Conferir se o arquivo é um JSON válido com número de concurso
        run: python3 -c "import json; d = json.load(open('espelho/ultimo_resultado.json')); assert d.get('numero'); print('concurso', d['numero'], 'ok')"

      - name: Publicar a atualização (se mudou algo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add espelho/ultimo_resultado.json
          git diff --cached --quiet && echo "Sem mudanças." || (git commit -m "Atualiza espelho/ultimo_resultado.json [automático]" && git push)
